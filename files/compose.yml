---
name: code-gov-update

secrets:
  aws_config:
    file: secrets/aws_config
  scraper_config:
    file: secrets/scraper.json

services:
  update:
    command:
      # yamllint/ansible-lint complain about several of these lines
      # being quoted, but we want to ensure that the @s are not
      # interpreted as YAML special characters.
      #
      # yamllint disable-line rule:quoted-strings
      - "--cc=cisa-cyhy-mailer@gwe.cisa.dhs.gov"
      # yamllint disable-line rule:quoted-strings
      - "--from=code@cyber.dhs.gov"
      - --html=body.html
      - --json=code.json
      - --log-level=info
      # yamllint disable-line rule:quoted-strings
      - "--reply=cisa-cyhy-mailer@gwe.cisa.dhs.gov"
      - --subject="Latest code.gov JSON file"
      - --text=body.txt
      # yamllint disable-line rule:quoted-strings
      - "--to=webpublishing@hq.dhs.gov"
    environment:
      - AWS_CONFIG_FILE=/run/secrets/aws_config
      - AWS_PROFILE=default
    image: cisagov/code-gov-update:0.3.0-rc.7
    secrets:
      - source: aws_config
        target: aws_config
      - source: scraper_config
        target: scraper_config.json
